[project]
name = "cspy-source"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Thatt Bunnag", email = "tom.tom.thanet@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numba>=0.66.0",
    "numpy>=2.4.6",
    "opencv-contrib-python>=5.0.0.93",
    "pandas>=3.0.5",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
]

[project.scripts]
cspy-source = "cspy_source:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
